[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-mbt"
version = "0.1.0"
description = "Vendor-neutral multi-backend conformance test harness for PyTorch operators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "torch-mbt contributors" }]
keywords = [
  "pytorch",
  "pytest",
  "testing",
  "conformance",
  "accelerator",
  "multi-backend",
  "privateuse1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["torch>=2.1", "pytest>=7.4"]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/OWNER/torch-mbt"  # TODO: replace OWNER with the publishing org
Issues = "https://github.com/OWNER/torch-mbt/issues"

[project.scripts]
torch-mbt = "torch_mbt.cli:main"

[project.entry-points.pytest11]
mbt = "torch_mbt.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_mbt = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "mbt_backend(*names): run this test only on the listed backends",
  "mbt_exclude_backend(*names): never run this test on the listed backends",
  "mbt_family(name): operator family, used for reporting grouping",
  "mbt_op(name): operator name, used for reporting grouping",
  "mbt_grad: test exercises the autograd path",
  "mbt_slow: long running test, deselect with -m 'not mbt_slow'",
]
filterwarnings = ["error::DeprecationWarning:torch_mbt.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PIE", "PT"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "B008",   # function calls in argument defaults are used by pytest fixtures
  "PT011",  # pytest.raises match= is optional for our purposes
  "PT012",  # multi-statement raises blocks are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT", "B011"]
"docs/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
